name: 檢查與發布

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同一時間只跑一個發布，避免新舊版本互相覆蓋
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: 檢查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 產生靜態內容（價格、結構化資料、sitemap）
        run: node scripts/build.mjs
      - name: 檢查語法、連結與圖片大小
        run: node scripts/check.mjs

  deploy:
    name: 發布到 GitHub Pages
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: 整理要發布的檔案
        run: |
          node scripts/build.mjs
          mkdir _site
          cp -r index.html card.html contact.vcf robots.txt sitemap.xml llms.txt 69ea85e35b38b64cc0d55ad2fe4b18c0.txt favicon.svg css js images _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
      # IndexNow：網站更新後主動通知 Bing 等搜尋引擎來重新讀取。
      # 金鑰是公開的（就是網站根目錄的 69ea85e35b38b64cc0d55ad2fe4b18c0.txt），通知失敗不影響發布。
      - name: 通知 Bing（IndexNow）
        continue-on-error: true
        run: |
          code=$(curl -s -o /tmp/indexnow.txt -w "%{http_code}" -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{"host":"gohike.tw","key":"69ea85e35b38b64cc0d55ad2fe4b18c0","keyLocation":"https://gohike.tw/69ea85e35b38b64cc0d55ad2fe4b18c0.txt","urlList":["https://gohike.tw/","https://gohike.tw/card.html"]}')
          echo "IndexNow 回應：$code $(cat /tmp/indexnow.txt)"
          case "$code" in 200|202) ;; *) exit 1 ;; esac
