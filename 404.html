<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>找不到這個頁面｜山行接駁</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#14231c">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="page">
  <!-- 找不到的網址（例如已下架的路線頁）會顯示這一頁；GitHub Pages 會自動使用根目錄的 404.html -->
  <header class="header is-solid page-header">
    <div class="wrap header__inner">
      <a class="logo" href="/">
        <svg class="logo__mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M2 26 12 8l5 8 3-4 10 14z" fill="currentColor"/><path d="M12 8l3 4.8-3 2.2-3-1.6z" fill="#fff" opacity=".9"/></svg>
        <span class="logo__text"><b>山行接駁</b><small>登山口專車</small></span>
      </a>
      <a class="btn btn--accent btn--sm" href="/#book">免費詢價</a>
    </div>
  </header>

  <main class="section notfound">
    <div class="wrap wrap--narrow">
      <p class="eyebrow">404</p>
      <h1>這條路走不通</h1>
      <p class="section__lead">你要找的頁面不存在，可能是路線已經下架或網址打錯了。沒列在網站上的登山口也可以問我們，告訴我們你要爬哪座山就好。</p>
      <div class="route-page__cta">
        <a class="btn btn--accent btn--lg" href="/#routes">看熱門路線</a>
        <a class="btn btn--outline btn--lg" href="/#book">直接詢價</a>
      </div>
    </div>
  </main>
</body>
</html>
